<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>小K AI · 对话助手</title>
  <style>
    :root {
      --brand: #4d6bfe;
      --brand-dark: #3a55d8;
      --brand-soft: #eef2ff;
      --bg: #ffffff;
      --chat-bg: #fafbfc;
      --text: #1f2329;
      --sub: #8a9099;
      --border: #e8eaed;
      --user-bubble: linear-gradient(135deg, #5b7bff 0%, #4d6bfe 100%);
      --ai-bubble: #f4f5f7;
      --err: #e0524d;
      --err-bg: #fdecea;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      font-size: 15px; color: var(--text); background: var(--bg);
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- 顶栏 ---------- */
    header {
      display: flex; align-items: center; gap: 11px;
      padding: 13px 22px; border-bottom: 1px solid var(--border); background: #fff;
    }
    .logo {
      width: 34px; height: 34px; border-radius: 10px; overflow: hidden; flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(77,107,254,.35);
    }
    .title { font-weight: 700; font-size: 16px; line-height: 1.1; }
    .title small { display: block; font-weight: 500; font-size: 11px; color: var(--sub); margin-top: 2px; }
    .status { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--sub); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #c8ccd4; }
    .dot.ok { background: #2bbd7e; box-shadow: 0 0 0 3px rgba(43,189,126,.18); }
    .dot.bad { background: var(--err); box-shadow: 0 0 0 3px rgba(224,82,77,.18); }

    /* ---------- 聊天区 ---------- */
    #messages {
      flex: 1; overflow-y: auto; background: var(--chat-bg);
      padding: 26px 16px 10px;
    }
    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-thumb { background: #d8dbe0; border-radius: 4px; }
    .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }

    .msg { display: flex; gap: 12px; align-items: flex-start; animation: pop .28s ease; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .avatar {
      width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0; overflow: hidden;
      box-shadow: 0 2px 8px rgba(77,107,254,.3);
    }
    .bubble {
      max-width: 82%; padding: 12px 16px; border-radius: 16px; line-height: 1.7;
      white-space: pre-wrap; word-break: break-word; font-size: 15px;
    }
    .msg.user { flex-direction: row-reverse; }
    .msg.user .bubble {
      background: var(--user-bubble); color: #fff; border-bottom-right-radius: 5px;
      box-shadow: 0 4px 14px rgba(77,107,254,.28);
    }
    .msg.ai .bubble {
      background: var(--ai-bubble); color: var(--text); border-bottom-left-radius: 5px;
    }
    .msg.err .bubble { background: var(--err-bg); color: var(--err); }

    .cursor {
      display: inline-block; width: 8px; height: 16px; vertical-align: -2px;
      margin-left: 2px; border-radius: 2px; background: var(--brand);
      animation: blink 1s steps(2, start) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }

    .pre {
      margin: 8px 0; padding: 12px 14px; background: #1e2430; color: #e6e9ef;
      border-radius: 10px; font: 13px/1.6 "SF Mono", Consolas, Monaco, monospace;
      overflow-x: auto; white-space: pre;
    }

    /* ---------- 空状态 ---------- */
    .empty { max-width: 760px; margin: 8vh auto 0; text-align: center; padding: 0 16px; }
    .empty h1 { font-size: 26px; margin: 0 0 8px; font-weight: 700; }
    .empty p { color: var(--sub); margin: 0 0 28px; }
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 560px; margin: 0 auto; }
    .card {
      text-align: left; padding: 14px 16px; border: 1px solid var(--border);
      border-radius: 14px; background: #fff; cursor: pointer; transition: .15s; font-size: 14px;
    }
    .card:hover { border-color: var(--brand); background: var(--brand-soft); transform: translateY(-2px); }

    /* ---------- 输入栏 ---------- */
    .input-bar { padding: 14px 16px 18px; background: var(--chat-bg); border-top: 1px solid var(--border); }
    .box {
      max-width: 760px; margin: 0 auto; display: flex; align-items: flex-end; gap: 10px;
      background: #fff; border: 1px solid var(--border); border-radius: 22px; padding: 8px 8px 8px 18px;
      box-shadow: var(--brand) 0 0 0 0; transition: border-color .15s, box-shadow .15s;
    }
    .box:focus-within { border-color: var(--brand); box-shadow: 0 0 0 4px rgba(77,107,254,.12); }
    textarea {
      flex: 1; border: none; outline: none; resize: none; background: transparent;
      font: inherit; line-height: 1.6; max-height: 160px; padding: 8px 0; color: var(--text);
    }
    textarea::placeholder { color: #b3b8c2; }
    .send {
      width: 40px; height: 40px; flex-shrink: 0; border: none; border-radius: 50%;
      background: var(--user-bubble); color: #fff; cursor: pointer; display: flex;
      align-items: center; justify-content: center; transition: .15s;
    }
    .send:hover:not(:disabled) { transform: scale(1.06); }
    .send:disabled { background: #c4ccda; cursor: not-allowed; }
    .send svg { width: 19px; height: 19px; }

    @media (max-width: 600px) {
      .cards { grid-template-columns: 1fr; }
      .bubble { max-width: 90%; }
    }
  </style>
</head>
<body>
  <header>
    <span class="logo" id="logo"></span>
    <span class="title">小K AI<small>本地大模型 · 对话助手</small></span>
    <span class="status"><span class="dot" id="dot"></span><span id="status">连接中…</span></span>
  </header>

  <div id="messages"></div>

  <div class="input-bar">
    <div class="box">
      <textarea id="input" rows="1" placeholder="给小K发消息，Enter 发送，Shift+Enter 换行"></textarea>
      <button class="send" id="send" title="发送">K
        <svg viewBox="0 0 24 24" fill="none"><path d="M3.4 20.4 21 12 3.4 3.6l.1 6.9L15 12 3.5 13.5z" fill="currentColor"/></svg>
      </button>
    </div>
  </div>

  <script>
    const LOGO_SVG =
      '<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#6e8bff"/><stop offset="1" stop-color="#3a55d8"/></linearGradient></defs>' +
      '<rect x="6" y="6" width="52" height="52" rx="15" fill="url(#g)"/>' +
      '<rect x="17" y="19" width="30" height="22" rx="7" fill="#fff"/>' +
      '<path d="M26 41 26 50 36 41 z" fill="#fff"/>' +
      '<circle cx="27" cy="30" r="2.6" fill="#3a55d8"/>' +
      '<circle cx="32" cy="30" r="2.6" fill="#3a55d8"/>' +
      '<circle cx="37" cy="30" r="2.6" fill="#3a55d8"/></svg>';

    document.getElementById("logo").innerHTML = LOGO_SVG;
    const fav = document.createElement("link");
    fav.rel = "icon";
    fav.href = "data:image/svg+xml," + encodeURIComponent(LOGO_SVG);
    document.head.appendChild(fav);

    const $ = (id) => document.getElementById(id);
    const messagesEl = $("messages"), inputEl = $("input"), sendEl = $("send");
    const dotEl = $("dot"), statusEl = $("status");

    // 简洁空状态引导
    const EMPTY = '<div class="empty"><h1>你好，我是小K AI 👋</h1>' +
      '<p>我能帮你写代码、答疑解惑、整理思路。下面是几个可以试试的问题：</p>' +
      '<div class="cards">' +
      '<div class="card" data-q="用 Python 写一个快速排序并解释思路">💡 写个快排并讲解</div>' +
      '<div class="card" data-q="什么是 HTTP 和 HTTPS 的区别？">🌐 HTTP 与 HTTPS 区别</div>' +
      '<div class="card" data-q="帮我用一句话介绍什么是大语言模型">🤖 什么大语言模型</div>' +
      '<div class="card" data-q="给我三个提升专注力的小建议">✅ 提升专注力建议</div>' +
      '</div></div>';
    messagesEl.innerHTML = EMPTY;

    let messages = [];   // 完整对话历史，发给后端以保持上下文
    let busy = false;

    function addRow(role, contentNode) {
      const row = document.createElement("div");
      row.className = "msg " + role;
      if (role === "ai") {
        const av = document.createElement("span");
        av.className = "avatar"; av.innerHTML = LOGO_SVG;
        row.appendChild(av);
      }
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      if (contentNode) bubble.appendChild(contentNode);
      row.appendChild(bubble);
      messagesEl.querySelector(".wrap")?.remove(); // 有消息后移除空状态
      ensureWrap().appendChild(row);
      scrollBottom();
      return bubble;
    }
    function ensureWrap() {
      let w = messagesEl.querySelector(".wrap");
      if (!w) { w = document.createElement("div"); w.className = "wrap"; messagesEl.appendChild(w); }
      return w;
    }
    function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

    async function checkHealth() {
      try {
        const r = await fetch("/api/health");
        const d = await r.json();
        if (d.ok) { dotEl.className = "dot ok"; statusEl.textContent = "已连接 · " + d.model; }
        else { dotEl.className = "dot bad"; statusEl.textContent = "Ollama 未就绪，请先启动并拉取模型"; }
      } catch {
        dotEl.className = "dot bad"; statusEl.textContent = "无法连接后端，请先启动服务";
      }
    }

    async function send(textOverride) {
      const text = (textOverride ?? inputEl.value).trim();
      if (!text || busy) return;

      messages.push({ role: "user", content: text });
      addRow("user", document.createTextNode(text));
      inputEl.value = ""; inputEl.style.height = "auto";

      const bubble = addRow("ai", null);
      const cursor = document.createElement("span"); cursor.className = "cursor";
      bubble.appendChild(cursor);
      let acc = ""; busy = true; sendEl.disabled = true;

      try {
        const resp = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages }),
        });
        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buf = "";
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          const parts = buf.split("\n\n"); buf = parts.pop();
          for (const part of parts) {
            if (!part.startsWith("data: ")) continue;
            const data = part.slice(6).trim();
            if (data === "[DONE]") continue;
            const json = JSON.parse(data);
            if (json.error) {
              cursor.remove();
              bubble.parentElement.className = "msg err";
              bubble.textContent = "出错了：" + json.error;
            } else if (json.content) {
              acc += json.content;
              bubble.textContent = acc; bubble.appendChild(cursor);
              scrollBottom();
            }
          }
        }
        cursor.remove();
        if (acc) {
          messages.push({ role: "assistant", content: acc });
          renderRich(bubble, acc);
        }
      } catch (e) {
        cursor.remove();
        bubble.parentElement.className = "msg err";
        bubble.textContent = "请求失败：" + e.message;
      } finally {
        busy = false; sendEl.disabled = false;
      }
    }

    // 轻量富文本：仅把 ```代码块``` 安全渲染为 <pre>，其余保持纯文本（防 XSS）
    function renderRich(bubble, text) {
      const segs = text.split(/```/);
      bubble.textContent = "";
      segs.forEach((seg, i) => {
        if (i % 2 === 1) {
          const pre = document.createElement("pre"); pre.className = "pre"; pre.textContent = seg.replace(/^\n/, "");
          bubble.appendChild(pre);
        } else if (seg) {
          bubble.appendChild(document.createTextNode(seg));
        }
      });
      if (!bubble.hasChildNodes()) bubble.textContent = text;
    }

    sendEl.onclick = () => send();
    inputEl.addEventListener("input", () => {
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
    });
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
    });
    messagesEl.addEventListener("click", (e) => {
      const card = e.target.closest(".card");
      if (card) send(card.dataset.q);
    });

    checkHealth();
  </script>
</body>
</html>
